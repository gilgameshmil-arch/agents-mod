name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Validar assets (modelos, texturas, receitas, textos)
        run: |
          pip install pillow --quiet || true
          python3 tools/validate_assets.py
      - name: Build
        run: gradle build --no-daemon
      - name: Boot do servidor dedicado (smoke test)
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          (sleep 110; echo stop) | timeout 400 gradle runServer --no-daemon > server.log 2>&1 || true
          tail -40 server.log
          grep -q 'Done (' server.log || { echo "::error::o servidor não chegou ao Done"; exit 1; }
          if grep -iE '(ERROR|Exception).*(agentsmod|recipe|item model)' server.log; then echo "::error::erros do mod no boot"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: agents-mod-jar
          path: build/libs/*.jar
      - name: Publicar Release (jar pronto para instalar)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/agents-mod-*.jar | grep -v sources | head -n1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" --title "Agents Mod - última versão" \
            --notes "Minecraft 1.21.11 (Fabric). Requer Fabric Loader 0.18+ e Fabric API 0.141.6+1.21.11. Baixe o .jar e coloque na pasta mods."
